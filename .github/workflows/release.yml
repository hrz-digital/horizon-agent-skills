name: Release Skills

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Verify skills
        run: python3 tests/verify.py
      - name: Validate release tag
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          expected=$(tr -d '[:space:]' < VERSION)
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || {
            echo "Invalid Skills release tag: $tag" >&2
            exit 1
          }
          [[ "$version" == "$expected" || "$version" == "$expected"-* ]] || {
            echo "Tag $tag does not match VERSION $expected" >&2
            exit 1
          }
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --title "Horizon Skills $GITHUB_REF_NAME" --generate-notes
