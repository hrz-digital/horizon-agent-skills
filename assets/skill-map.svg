<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1000" viewBox="0 0 960 1000" role="img" aria-labelledby="title description">
  <title id="title">Horizon Agent Skills capability map</title>
  <desc id="description">Connect and coordinate with horizon, and clarify and plan with horizon-interview when needed. Four capability pillars: Understand with horizon-ask-for-guidance; Design and build with horizon-design and horizon-metadata-authoring; Operate with horizon-runtime; Review and improve with horizon-architecture-analysis. Authoring covers Data Modeling, Visualization and Automation. Shared foundations are Horizon CLI, current Horizon Discovery, and human Metadata review and Publication.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101e37"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3075ff"/>
      <stop offset="1" stop-color="#2358d5"/>
    </linearGradient>
  </defs>
  <g font-family="Arial, Helvetica, sans-serif">
    <rect width="960" height="1000" rx="24" fill="url(#background)"/>
    <rect x="1" y="1" width="958" height="998" rx="23" fill="none" stroke="#2a3951"/>

    <!-- Start with the user's goals; skill names are secondary labels. -->
    <rect x="40" y="40" width="28" height="4" rx="2" fill="#528bff"/>
    <text x="80" y="47" fill="#a5bde5" font-size="13" font-weight="700" letter-spacing="2">HORIZON AGENT SKILLS</text>
    <text x="40" y="99" fill="#f5f8ff" font-size="36" font-weight="700" letter-spacing="-1">One request. The right workflow.</text>
    <text x="40" y="133" fill="#b3c2d8" font-size="19">Understand, build, operate and improve your Horizon Installation.</text>

    <!-- Coordination supports the pillars; planning applies when needed. -->
    <rect x="40" y="166" width="880" height="116" rx="14" fill="#172840" stroke="#304865"/>
    <line x1="480" y1="190" x2="480" y2="258" stroke="#344a67"/>
    <g transform="translate(64 191)" fill="none" stroke="#76a5ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="9" cy="9" r="4"/>
      <circle cx="28" cy="4" r="3"/>
      <circle cx="28" cy="23" r="3"/>
      <path d="M13 8 25 5M12 12 25 21"/>
    </g>
    <text x="110" y="205" fill="#f5f8ff" font-size="21" font-weight="700">Connect &amp; coordinate</text>
    <text x="64" y="235" fill="#bdcce0" font-size="17">Select an Installation. Discover. Route. Resume.</text>
    <text x="64" y="261" fill="#8eb5ff" font-size="15" font-family="monospace">horizon</text>
    <g transform="translate(504 190)" fill="none" stroke="#76a5ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 3h25v18H13l-7 6v-6H3zM9 9h13M9 15h8"/>
    </g>
    <text x="550" y="205" fill="#f5f8ff" font-size="21" font-weight="700">Clarify &amp; plan</text>
    <text x="504" y="235" fill="#bdcce0" font-size="17">Settle requirements and approvals when needed.</text>
    <text x="504" y="261" fill="#8eb5ff" font-size="15" font-family="monospace">horizon-interview</text>

    <text x="40" y="321" fill="#8d9fb9" font-size="12" font-weight="700" letter-spacing="2">FOUR WAYS TO WORK</text>

    <!-- Pillar 1 -->
    <rect x="40" y="342" width="428" height="220" rx="16" fill="#142139" stroke="#2c405c"/>
    <rect x="64" y="366" width="40" height="40" rx="11" fill="#18385c"/>
    <g transform="translate(74 376)" fill="none" stroke="#71c1f8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M1 2c4-1 7 0 9 2 2-2 5-3 9-2v15c-4-1-7 0-9 2-2-2-5-3-9-2zM10 4v15"/>
    </g>
    <text x="120" y="382" fill="#71c1f8" font-size="12" font-weight="700" letter-spacing="1.8">01 / UNDERSTAND</text>
    <text x="120" y="407" fill="#f3f7ff" font-size="23" font-weight="700">Find the right approach</text>
    <text x="64" y="445" fill="#bdcce0" font-size="18">Modeling advice, configured behavior</text>
    <text x="64" y="472" fill="#bdcce0" font-size="18">and help using the skill set.</text>
    <line x1="64" y1="495" x2="444" y2="495" stroke="#2c405c"/>
    <text x="64" y="523" fill="#9dd3fa" font-size="16" font-family="monospace">horizon-ask-for-guidance</text>
    <text x="64" y="546" fill="#8d9fb9" font-size="14">Explicitly invoked by the user · read-only</text>

    <!-- Pillar 2 -->
    <rect x="492" y="342" width="428" height="220" rx="16" fill="#142541" stroke="#3b65a0"/>
    <rect x="516" y="366" width="40" height="40" rx="11" fill="url(#blue)"/>
    <g transform="translate(526 376)" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="m2 15 11-11 4 4L6 19H2zM11 6l4 4M2 2h5M17 15v5M14.5 17.5h5"/>
    </g>
    <text x="572" y="382" fill="#93b7ff" font-size="12" font-weight="700" letter-spacing="1.8">02 / DESIGN &amp; BUILD</text>
    <text x="572" y="407" fill="#f3f7ff" font-size="23" font-weight="700">Turn ideas into Horizon</text>
    <text x="516" y="445" fill="#bdcce0" font-size="18">Design Briefs and returned designs.</text>
    <text x="516" y="472" fill="#bdcce0" font-size="18">Data Modeling → Visualization → Automation</text>
    <line x1="516" y1="495" x2="896" y2="495" stroke="#355379"/>
    <text x="516" y="523" fill="#a5c2ff" font-size="16" font-family="monospace">horizon-design</text>
    <text x="516" y="547" fill="#a5c2ff" font-size="16" font-family="monospace">horizon-metadata-authoring</text>

    <!-- Pillar 3 -->
    <rect x="40" y="586" width="428" height="220" rx="16" fill="#142139" stroke="#2c405c"/>
    <rect x="64" y="610" width="40" height="40" rx="11" fill="#123c3b"/>
    <g transform="translate(74 620)" fill="none" stroke="#77dbc1" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="m6 2 13 8L6 18z"/>
    </g>
    <text x="120" y="626" fill="#77dbc1" font-size="12" font-weight="700" letter-spacing="1.8">03 / OPERATE</text>
    <text x="120" y="651" fill="#f3f7ff" font-size="23" font-weight="700">Work with live business data</text>
    <text x="64" y="689" fill="#bdcce0" font-size="18">Records, Dashboards, Actions and Processes.</text>
    <text x="64" y="716" fill="#bdcce0" font-size="18">Assigned interactions and email settings.</text>
    <line x1="64" y1="739" x2="444" y2="739" stroke="#2c405c"/>
    <text x="64" y="767" fill="#93dfca" font-size="16" font-family="monospace">horizon-runtime</text>
    <text x="64" y="790" fill="#8d9fb9" font-size="14">Current authority · confirmed data mutations</text>

    <!-- Pillar 4 -->
    <rect x="492" y="586" width="428" height="220" rx="16" fill="#142139" stroke="#2c405c"/>
    <rect x="516" y="610" width="40" height="40" rx="11" fill="#30294f"/>
    <g transform="translate(526 620)" fill="none" stroke="#bda4f6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="8" cy="8" r="6"/>
      <path d="m13 13 6 6M5 8l2 2 4-4"/>
    </g>
    <text x="572" y="626" fill="#bda4f6" font-size="12" font-weight="700" letter-spacing="1.8">04 / REVIEW &amp; IMPROVE</text>
    <text x="572" y="651" fill="#f3f7ff" font-size="23" font-weight="700">Keep the model coherent</text>
    <text x="516" y="689" fill="#bdcce0" font-size="18">Audit Published Metadata for overlap</text>
    <text x="516" y="716" fill="#bdcce0" font-size="18">and track architectural improvements.</text>
    <line x1="516" y1="739" x2="896" y2="739" stroke="#2c405c"/>
    <text x="516" y="767" fill="#cbb6fb" font-size="16" font-family="monospace">horizon-architecture-analysis</text>
    <text x="516" y="790" fill="#8d9fb9" font-size="14">Audit · Tickets · post-Publication verification</text>

    <!-- Foundations apply across the capability map, not as extra skills. -->
    <text x="40" y="851" fill="#8d9fb9" font-size="12" font-weight="700" letter-spacing="2">SHARED FOUNDATIONS</text>
    <line x1="40" y1="869" x2="920" y2="869" stroke="#2c405c"/>
    <circle cx="48" cy="902" r="4" fill="#528bff"/>
    <text x="64" y="908" fill="#e2eaf7" font-size="19" font-weight="700">Horizon CLI</text>
    <text x="64" y="936" fill="#9dacc3" font-size="16">Secure connection &amp; transport</text>
    <circle cx="348" cy="902" r="4" fill="#528bff"/>
    <text x="364" y="908" fill="#e2eaf7" font-size="19" font-weight="700">Horizon Discovery</text>
    <text x="364" y="936" fill="#9dacc3" font-size="16">Current contracts &amp; authority</text>
    <circle cx="658" cy="902" r="4" fill="#528bff"/>
    <text x="674" y="908" fill="#e2eaf7" font-size="19" font-weight="700">Human review</text>
    <text x="674" y="936" fill="#9dacc3" font-size="16">Metadata approval &amp; Publication</text>
    <text x="40" y="978" fill="#7386a3" font-size="13">A capability map · choose the workflow that matches your goal</text>
  </g>
</svg>
